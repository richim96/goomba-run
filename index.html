<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#1b1430" />
    <title>Goomba Run</title>
    <link rel="icon" href="data:," />
    <!-- For the copy on the website: lets an iPhone or iPad save the game to the Home Screen
         and a Mac add it to the Dock. A double-clicked file ignores these. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Goomba Run" />
    <style>
      html, body { margin: 0; height: 100%; background: #1b1430; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      }
      #rotate { display: none; margin: 0; color: #cfc3e6; font: 600 14px ui-rounded, system-ui, sans-serif; }
      @media (orientation: portrait) and (max-width: 600px) { #rotate { display: block; } }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; outline: none; }
    </style>
  </head>
  <body>
    <canvas id="game" width="320" height="180" tabindex="0" aria-label="Goomba Run"></canvas>
    <p id="rotate">Turn your phone sideways for a bigger game</p>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
